<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Vintage Avenue</title>
  <link rel="stylesheet" href="/css/style.css?v=2.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="justify-content: center; align-items: center;">

  <div style="width: 100%; max-width: 440px; padding: 24px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <a href="/index.html" class="brand-logo" style="justify-content: center; font-size: 2.2rem;">
        <i class="fa-solid fa-gem"></i>
        <span>VINTAGE AVENUE</span>
      </a>
      <p style="color: var(--color-text-secondary); margin-top: 8px; font-size: 0.95rem;">
        Retail Management & Administrative Portal
      </p>
    </div>

    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 40px; box-shadow: var(--shadow-sm);">
      <h2 style="font-size: 1.8rem; font-weight: 700; color: var(--color-gold); margin-bottom: 24px; text-align: center;">
        Sign In
      </h2>

      <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 12px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 20px; text-align: center;">
      </div>

      <form id="admin-login-form">
        <div style="margin-bottom: 20px;">
          <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--color-text-secondary); margin-bottom: 8px;">
            Admin Email or Username
          </label>
          <input type="text" id="login-username" class="form-control" value="" placeholder="Enter Admin Email or Username" required style="width: 100%;">
        </div>

        <div style="margin-bottom: 28px;">
          <label style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--color-text-secondary); margin-bottom: 8px;">
            Password
          </label>
          <input type="password" id="login-password" class="form-control" value="" placeholder="Enter Password" required style="width: 100%;">
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; padding: 14px;">
          Login to Dashboard
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center;">
        <a href="/index.html" style="font-size: 0.85rem; color: var(--color-text-muted);">&larr; Return to Public Storefront</a>
      </div>
    </div>
  </div>

  <script src="/js/admin.js?v=3.0"></script>
</body>
</html>
