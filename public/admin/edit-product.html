<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product | Vintage Avenue Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="/admin/dashboard.html" class="brand-logo">
        <i class="fa-solid fa-gem"></i>
        <span>VINTAGE AVENUE <small style="font-size: 0.8rem; color: var(--color-text-muted);">[ADMIN]</small></span>
      </a>

      <ul class="nav-links">
        <li><a href="/admin/dashboard.html">Dashboard</a></li>
        <li><a href="/admin/products.html" class="active">Products</a></li>
        <li><a href="/admin/categories.html">Categories</a></li>
        <li><a href="/admin/orders.html">Orders</a></li>
        <li><a href="/admin/customers.html">Recurrent VIPs</a></li>
        <li><a href="/admin/sales.html">Sales Reports</a></li>
        <li><a href="/admin/settings.html">Settings</a></li>
        <li><a href="/index.html" target="_blank" style="color: var(--color-text-secondary);"><i class="fa-solid fa-external-link"></i> Live Store</a></li>
      </ul>

      <div class="nav-actions">
        <button id="admin-logout-btn" class="btn btn-outline btn-sm">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 40px 24px 80px; max-width: 850px;">
    <div style="margin-bottom: 24px;">
      <a href="/admin/products.html" style="color: var(--color-text-secondary);">&larr; Back to Products Table</a>
    </div>

    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 40px;">
      <h1 style="font-size: 2.2rem; font-weight: 700; color: var(--color-gold); margin-bottom: 32px;">Edit Product Details</h1>

      <form id="edit-product-form">
        <div style="grid-template-columns: 1fr 1fr; display: grid; gap: 20px; margin-bottom: 20px;">
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">Product Name *</label>
            <input type="text" id="edit-name" class="form-control" required style="width: 100%;">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">SKU Code *</label>
            <input type="text" id="edit-sku" class="form-control" required style="width: 100%;">
          </div>
        </div>

        <div style="grid-template-columns: 1fr 1fr; display: grid; gap: 16px; margin-bottom: 20px;">
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">Main Category *</label>
            <select id="edit-category" class="form-control" required style="width: 100%;">
              <option value="">Loading Categories...</option>
            </select>
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">Subcategory</label>
            <select id="edit-subcategory" class="form-control" style="width: 100%;">
              <option value="">-- None --</option>
            </select>
          </div>
        </div>

        <div style="grid-template-columns: 1fr 1fr 1fr; display: grid; gap: 16px; margin-bottom: 20px;">
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-gold); margin-bottom: 8px;">Sale Price ($) *</label>
            <input type="number" id="edit-price" step="0.01" min="0" class="form-control" required style="width: 100%; border-color: var(--color-gold);">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 8px;">Cost Price ($) [Admin]</label>
            <input type="number" id="edit-cost-price" step="0.01" min="0" class="form-control" style="width: 100%;">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">Stock Quantity *</label>
            <input type="number" id="edit-quantity" min="0" class="form-control" required style="width: 100%;">
          </div>
        </div>

        <div style="grid-template-columns: 1fr 1fr; display: grid; gap: 20px; margin-bottom: 20px;">
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">Era</label>
            <input type="text" id="edit-era" class="form-control" style="width: 100%;">
          </div>
          <div>
            <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">Condition</label>
            <input type="text" id="edit-condition" class="form-control" style="width: 100%;">
          </div>
        </div>

        <!-- Firebase Storage Multi-File Upload Section -->
        <div style="margin-bottom: 28px; background: var(--bg-secondary); border: 1px dashed var(--color-gold); padding: 24px; border-radius: var(--radius-md);">
          <label style="display: block; font-size: 0.9rem; text-transform: uppercase; color: var(--color-gold); font-weight: 700; margin-bottom: 8px;">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload / Add Product Images
          </label>
          <p style="font-size: 0.85rem; color: var(--color-text-secondary); margin-bottom: 16px;">
            Select multiple image files or paste an image URL directly below.
          </p>

          <input type="file" id="edit-files-input" multiple accept="image/*" class="form-control" style="width: 100%; margin-bottom: 16px;">

          <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <input type="url" id="direct-url-input" class="form-control" placeholder="Or paste image URL (e.g. https://...)" style="flex: 1;">
            <button type="button" id="add-direct-url-btn" class="btn btn-outline" style="padding: 8px 16px; font-size: 0.85rem;">Add URL</button>
          </div>

          <div id="upload-status-box" style="display: none; margin-bottom: 16px; color: var(--color-gold); font-size: 0.85rem; font-weight: 600;">
            <i class="fa-solid fa-spinner fa-spin"></i> Processing images... <span id="upload-progress-text">0%</span>
          </div>

          <div id="firebase-preview-gallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px; margin-top: 16px;">
            <!-- Generated thumbnails -->
          </div>
        </div>

        <div style="margin-bottom: 32px;">
          <label style="display: block; font-size: 0.8rem; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 8px;">Description</label>
          <textarea id="edit-desc" class="form-control" rows="4" style="width: 100%; resize: vertical;"></textarea>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; padding: 14px;">Update Product Changes</button>
      </form>
    </div>
  </main>

  <script src="/js/admin.js"></script>
  <script type="module">
    import { uploadMultipleToFirebase } from '/js/firebase-storage.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const authenticated = await AdminAuth.checkAuthOrRedirect();
      if (!authenticated) return;

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        window.location.href = '/admin/products.html';
        return;
      }

      const categorySelect = document.getElementById('edit-category');
      const subcategorySelect = document.getElementById('edit-subcategory');
      const filesInput = document.getElementById('edit-files-input');
      const statusBox = document.getElementById('upload-status-box');
      const progressText = document.getElementById('upload-progress-text');
      const gallery = document.getElementById('firebase-preview-gallery');

      const DEFAULT_CATEGORIES = [
        { id: 'cat-1', name: 'Apparel & Clothing', slug: 'apparel', subcategories: [ { id: 'sub-1', name: 'Vintage Jackets' }, { id: 'sub-2', name: 'Luxury Hoodies' }, { id: 'sub-3', name: 'Retro Shirts' } ] },
        { id: 'cat-2', name: 'Rare Watches', slug: 'watches', subcategories: [ { id: 'sub-4', name: 'Automatic Chronographs' }, { id: 'sub-5', name: 'Gold Vintage Watches' } ] },
        { id: 'cat-3', name: 'Luxury Accessories', slug: 'accessories', subcategories: [ { id: 'sub-6', name: 'Leather Bags' }, { id: 'sub-7', name: 'Jewelry & Rings' } ] }
      ];

      function getStoredCategories() {
        try {
          const stored = localStorage.getItem('va_categories');
          if (stored) return JSON.parse(stored);
        } catch (e) {}
        return DEFAULT_CATEGORIES;
      }

      async function loadCategories() {
        try {
          const res = await fetch('/api/categories');
          if (res.ok) {
            const data = await res.json();
            categoryTree = (data && data.categories && data.categories.length > 0) ? data.categories : getStoredCategories();
          } else {
            categoryTree = getStoredCategories();
          }
        } catch (err) {
          categoryTree = getStoredCategories();
        }

        categorySelect.innerHTML = '<option value="">-- Select Category --</option>' + 
          categoryTree.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
      }

      function updateSubcategories(selectedCatName, selectedSubName = '') {
        const catObj = categoryTree.find(c => c.name === selectedCatName);
        if (catObj && catObj.subcategories && catObj.subcategories.length > 0) {
          subcategorySelect.innerHTML = '<option value="">-- None --</option>' +
            catObj.subcategories.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
          if (selectedSubName) {
            subcategorySelect.value = selectedSubName;
          }
        } else {
          subcategorySelect.innerHTML = '<option value="">-- None --</option>';
        }
      }

      categorySelect.addEventListener('change', () => {
        updateSubcategories(categorySelect.value);
      });

      await loadCategories();

      function renderGallery() {
        gallery.innerHTML = firebaseUrls.map((url, idx) => `
          <div style="position: relative; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 4px;">
            <img src="${url}" alt="Firebase Image ${idx + 1}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 4px;">
            <div style="font-size: 0.65rem; color: var(--color-gold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; padding: 0 2px;">
              ${url.substring(0, 30)}...
            </div>
            <button type="button" class="remove-img-btn" data-idx="${idx}" style="position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff; border: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 0.75rem;">&times;</button>
          </div>
        `).join('');

        document.querySelectorAll('.remove-img-btn').forEach(btn => {
          btn.addEventListener('click', (evt) => {
            const index = parseInt(evt.currentTarget.getAttribute('data-idx'), 10);
            firebaseUrls.splice(index, 1);
            renderGallery();
          });
        });
      }

      // Load Product Details
      try {
        const res = await fetch(`/api/products/${productId}`, {
          headers: { 'Authorization': `Bearer ${AdminAuth.getToken()}` }
        });
        const data = await res.json();
        if (res.ok) {
          const p = data.product;
          document.getElementById('edit-name').value = p.name || '';
          document.getElementById('edit-sku').value = p.sku || '';
          document.getElementById('edit-category').value = p.category || '';
          updateSubcategories(p.category, p.subcategory || '');

          document.getElementById('edit-price').value = p.price;
          document.getElementById('edit-cost-price').value = p.cost_price || 0;
          document.getElementById('edit-quantity').value = p.quantity;
          document.getElementById('edit-era').value = p.era || '';
          document.getElementById('edit-condition').value = p.condition || '';
          document.getElementById('edit-desc').value = p.description || '';

          if (p.image_url) {
            try {
              if (p.image_url.startsWith('[')) {
                firebaseUrls = JSON.parse(p.image_url);
              } else {
                firebaseUrls = [p.image_url];
              }
            } catch (e) {
              firebaseUrls = [p.image_url];
            }
          }
          renderGallery();
        }
      } catch (err) {
        showToast('Error loading product details', 'danger');
      }

      // Direct Image URL Handler
      const directUrlBtn = document.getElementById('add-direct-url-btn');
      const directUrlInput = document.getElementById('direct-url-input');

      if (directUrlBtn && directUrlInput) {
        directUrlBtn.addEventListener('click', () => {
          const url = directUrlInput.value.trim();
          if (url) {
            firebaseUrls.push(url);
            directUrlInput.value = '';
            renderGallery();
            showToast('Image URL added to product gallery!', 'success');
          }
        });
      }

      // Add Files Handler (Instant FileReader DataURL)
      filesInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        statusBox.style.display = 'none';

        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = (evt) => {
            firebaseUrls.push(evt.target.result);
            renderGallery();
          };
          reader.readAsDataURL(file);
        });

        showToast(`Added ${files.length} photo(s)!`, 'success');
      });

      const form = document.getElementById('edit-product-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const finalImagePayload = firebaseUrls.length > 0 
          ? (firebaseUrls.length === 1 ? firebaseUrls[0] : JSON.stringify(firebaseUrls))
          : 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&auto=format&fit=crop&q=80';

        const payload = {
          id: parseInt(productId, 10),
          name: document.getElementById('edit-name').value.trim(),
          sku: document.getElementById('edit-sku').value.trim(),
          category: document.getElementById('edit-category').value,
          subcategory: document.getElementById('edit-subcategory').value || null,
          price: parseFloat(document.getElementById('edit-price').value),
          cost_price: parseFloat(document.getElementById('edit-cost-price').value || 0),
          quantity: parseInt(document.getElementById('edit-quantity').value, 10),
          era: document.getElementById('edit-era').value.trim(),
          condition: document.getElementById('edit-condition').value.trim(),
          image_url: finalImagePayload,
          description: document.getElementById('edit-desc').value.trim()
        };

        try {
          const res = await fetch(`/api/products/${productId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${AdminAuth.getToken()}`
            },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            showToast('Product updated successfully!', 'success');
            setTimeout(() => window.location.href = '/admin/products.html', 800);
            return;
          }
        } catch (err) {
          console.warn('Backend API server offline, saving product update locally');
        }

        // Static hosting fallback saving
        try {
          let products = JSON.parse(localStorage.getItem('va_products') || '[]');
          const idx = products.findIndex(p => String(p.id) === String(productId));
          if (idx > -1) {
            products[idx] = { ...products[idx], ...payload };
          } else {
            products.unshift(payload);
          }
          localStorage.setItem('va_products', JSON.stringify(products));
        } catch (e) {}

        showToast('Product updated successfully!', 'success');
        setTimeout(() => window.location.href = '/admin/products.html', 800);
      });
    });
  </script>
</body>
</html>
